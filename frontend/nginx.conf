server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 é o DNS interno do Docker. Resolver "backend" numa
    # variável (em vez de direto no proxy_pass) faz o Nginx procurar o
    # host a cada requisição, não só uma vez na inicialização — sem isso,
    # se o container do backend não estiver de pé no exato instante em
    # que o Nginx sobe (por exemplo, reiniciando por outro motivo), o
    # Nginx recusa iniciar ("host not found in upstream"), derrubando o
    # frontend junto por tabela. Com isso, o pior caso vira só um 502 em
    # /api/ até o backend voltar, sem o Nginx cair.
    resolver 127.0.0.11 valid=10s;

    # API vai para o backend Go — mesma origem, sem CORS.
    #
    # Importante: o proxy_pass aqui NÃO tem nenhum caminho depois do host
    # (nada de "/api/" no final). Com host resolvido por variável, o
    # Nginx não re-escreve o caminho com base na location — ele só repassa
    # a URL exatamente como recebida quando não há caminho nenhum no
    # proxy_pass. Colocar "/api/" ali de volta reintroduz um bug real que
    # já aconteceu aqui: todo /api/* passou a responder 404 do backend.
    location /api/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: qualquer rota desconhecida cai no index.html do React Router.
    location / {
        try_files $uri /index.html;
    }
}
